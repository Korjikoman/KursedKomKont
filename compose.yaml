name: lab3-kursed

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kursed
      POSTGRES_USER: kursed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kursed_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: kursed
      PGUSER: kursed
      PGPASSWORD: ${POSTGRES_PASSWORD:-kursed_dev_password}
      PGCONNECT_TIMEOUT: "10"
      SQL_DIR: /sql
    volumes:
      - type: bind
        source: ./kursed_postgresql12_dbeaver.sql
        target: /sql/kursed_postgresql12_dbeaver.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./komkont_triggers_12_functions.sql
        target: /sql/komkont_triggers_12_functions.sql
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
