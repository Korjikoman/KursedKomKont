name: lab3-kursed

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kursed
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: kursed
      PGUSER: ${POSTGRES_USER:-root}
      PGPASSWORD: ${POSTGRES_PASSWORD:-root}
      PGCONNECT_TIMEOUT: "10"
      SQL_DIR: /sql
      SQL_SCHEMA_FILE: ${SQL_SCHEMA_FILE}
      SQL_FUNCTIONS_FILE: ${SQL_FUNCTIONS_FILE}
    volumes:
      - type: bind
        source: ./${SQL_SCHEMA_FILE}
        target: /sql/${SQL_SCHEMA_FILE}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./${SQL_FUNCTIONS_FILE}
        target: /sql/${SQL_FUNCTIONS_FILE}
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
